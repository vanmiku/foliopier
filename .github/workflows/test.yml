name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded commits no longer occupy runners. Tag pushes do not repeat CI.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci --omit=dev
      - run: node test/i18n-check.mjs --missing-only
      - run: node --test test/review-regressions.mjs test/update-release.mjs test/boot-setup.mjs test/lan-access.mjs
      - run: bash test/smoke.sh
      - run: node test/e2e.mjs --service none
  windows:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [none, startup]
    name: windows (${{ matrix.service }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node test/i18n-check.mjs --missing-only
      - run: node --test test/review-regressions.mjs test/update-release.mjs test/boot-setup.mjs test/lan-access.mjs
      - name: e2e, ${{ matrix.service }} service
        run: node test/e2e.mjs --service ${{ matrix.service }} --port 4890
      - name: setup.cmd entry point
        shell: cmd
        run: setup.cmd check --json
  browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/requirements-ui.txt
      - run: npm ci --omit=dev
      - run: python -m pip install -r test/requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - run: python test/ui-review.py
  release:
    timeout-minutes: 5
    needs: [unix, windows, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the tested version if it is new
        run: node .github/scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
